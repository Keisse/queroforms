<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QueroForms — diagnósticos orientados à conversão." />
    <title>QueroForms</title>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const route = params.get('__qf_route');
        if (route) {
          window.history.replaceState(null, '', decodeURIComponent(route));
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
