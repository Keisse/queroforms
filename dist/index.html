<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="qf-build" content="20260910-0414" />
    <meta name="description" content="Diagnóstico de Maturidade: diagnósticos orientados à conversão." />
    <title>Diagnóstico de Maturidade</title>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const route = params.get('__qf_route');
        if (route) {
          window.history.replaceState(null, '', decodeURIComponent(route));
          return;
        }

        if (params.has('__qf_refresh')) {
          params.delete('__qf_refresh');
          const clean = window.location.pathname + (params.toString() ? '?' + params.toString() : '') + window.location.hash;
          window.history.replaceState(null, '', clean);
        }

        async function checkForNewBuild() {
          try {
            const response = await fetch('/index.html?__qf_buildcheck=' + Date.now(), {
              cache: 'no-store',
              headers: { 'Cache-Control': 'no-cache' }
            });
            if (!response.ok) return;
            const html = await response.text();
            const parsed = new DOMParser().parseFromString(html, 'text/html');
            const latestBuild = parsed.querySelector('meta[name="qf-build"]')?.getAttribute('content') || '';
            const currentBuild = document.querySelector('meta[name="qf-build"]')?.getAttribute('content') || '';
            const latestScript = parsed.querySelector('script[type="module"][src]')?.getAttribute('src');
            const currentScript = document.querySelector('script[type="module"][src]')?.getAttribute('src');
            const changed = latestBuild && latestBuild !== currentBuild || (latestScript && currentScript && latestScript !== currentScript);
            if (!changed) return;

            const nextParams = new URLSearchParams(window.location.search);
            nextParams.set('__qf_refresh', Date.now().toString());
            if (latestBuild) nextParams.set('__qf_build', latestBuild);
            const nextUrl = window.location.pathname + '?' + nextParams.toString() + window.location.hash;
            window.location.replace(nextUrl);
          } catch (_) {
            // Se a checagem falhar, mantém a experiência atual sem interromper o usuário.
          }
        }

        window.addEventListener('load', function () {
          window.setTimeout(checkForNewBuild, 700);
        });
        window.addEventListener('focus', checkForNewBuild);
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') checkForNewBuild();
        });
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-gjI1vBpw.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Bvm-ra1G.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
