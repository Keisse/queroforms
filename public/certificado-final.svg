    <text x="550" y="177" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="9" fill="#bd7509">CERTIFICADO</text>

    <text x="550" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#082f6e">Mestre em Gestão de Projetos</text>
    <text x="550" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#082f6e">com Inteligência Artificial</text>
    <text x="550" y="389" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#2f5591">Uma Jornada fundamentada nas boas práticas do PMI</text>

    <line x1="352" y1="505" x2="466" y2="505" stroke="#2f86e5" stroke-width="3"/>
    <line x1="634" y1="505" x2="748" y2="505" stroke="#2f86e5" stroke-width="3"/>
    <text x="505" y="517" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#2584e8">★</text>
    <text x="550" y="522" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="47" fill="#315895">★</text>
    <text x="595" y="517" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#2584e8">★</text>
  </g>

