      <ellipse cx="-31" cy="-15" rx="6" ry="15" transform="rotate(-24 -31 -15)"/>
      <ellipse cx="-13" cy="-26" rx="5" ry="13" transform="rotate(-12 -13 -26)"/>
      <ellipse cx="46" cy="3" rx="7" ry="17" transform="rotate(36 46 3)"/>
      <ellipse cx="31" cy="-15" rx="6" ry="15" transform="rotate(24 31 -15)"/>
      <ellipse cx="13" cy="-26" rx="5" ry="13" transform="rotate(12 13 -26)"/>
      <path d="M-18 7 L18 7 L12 22 L-12 22 Z"/>
