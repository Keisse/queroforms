    <path d="M-16 93 L4 171 L26 149 L45 166 L36 91 Z" fill="#f6b62e" opacity=".72"/>
    <circle cx="0" cy="0" r="104" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#ffe28a" stroke-width="5"/>
    <circle cx="0" cy="0" r="71" fill="#d89213" opacity=".36"/>
    <path d="M0 -45 L13 -14 L47 -11 L21 10 L29 43 L0 25 L-29 43 L-21 10 L-47 -11 L-13 -14 Z" fill="#fff1bf"/>
