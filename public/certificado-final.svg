<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 726" role="img" aria-labelledby="title desc">
  <title id="title">Certificado Mestre em Gestão de Projetos com Inteligência Artificial</title>
  <desc id="desc">Certificado em tons de azul, branco e dourado com selo dourado à direita.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff1ff"/>
      <stop offset="1" stop-color="#cfe8fb"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffef9"/>
      <stop offset="1" stop-color="#fffdf5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc84b"/>
      <stop offset=".5" stop-color="#e9a41b"/>
      <stop offset="1" stop-color="#cc7f08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2c6596" flood-opacity=".18"/>
    </filter>
    <filter id="medalShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#8e5b08" flood-opacity=".24"/>
    </filter>
    <pattern id="waves" width="220" height="50" patternUnits="userSpaceOnUse">
      <path d="M0 33 C55 3 110 63 165 33 S275 3 330 33" fill="none" stroke="#d9e4ee" stroke-width="1.2" opacity=".42"/>
      <path d="M0 41 C55 11 110 71 165 41 S275 11 330 41" fill="none" stroke="#d9e4ee" stroke-width="1" opacity=".28"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1100" height="726" rx="40" fill="url(#bg)"/>

  <g transform="rotate(-2.2 540 355)" filter="url(#shadow)">
    <rect x="42" y="28" width="1016" height="658" rx="18" fill="url(#paper)"/>
    <rect x="65" y="50" width="970" height="614" rx="8" fill="none" stroke="#e9a41b" stroke-width="3"/>
    <rect x="78" y="63" width="944" height="588" rx="6" fill="none" stroke="#f2b63a" stroke-width="1.5"/>

    <path d="M78 108 Q112 106 116 65" fill="none" stroke="#e9a41b" stroke-width="2.5"/>
    <path d="M1022 108 Q988 106 984 65" fill="none" stroke="#e9a41b" stroke-width="2.5"/>
    <path d="M78 606 Q112 608 116 650" fill="none" stroke="#e9a41b" stroke-width="2.5"/>
    <path d="M1022 606 Q988 608 984 650" fill="none" stroke="#e9a41b" stroke-width="2.5"/>

    <rect x="82" y="505" width="845" height="128" fill="url(#waves)" opacity=".66"/>

    <g transform="translate(550 120)" fill="#e9a41b">
