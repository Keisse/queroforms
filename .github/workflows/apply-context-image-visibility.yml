name: Apply context image visibility

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch files
        run: python3 scripts/apply-context-image-visibility.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm run test:characterization

      - name: Build
        run: npm run build

      - name: Commit feature
        run: |
          rm .github/workflows/apply-context-image-visibility.yml
          rm scripts/apply-context-image-visibility.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Builder: permite ocultar imagem em telas de contexto"
          git push origin HEAD:main
