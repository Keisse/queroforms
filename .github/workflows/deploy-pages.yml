name: Deploy QueroForms to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Characterization tests
        run: npm run test:characterization

      - name: Build
        run: npm run build

      - name: Ensure SPA fallback and custom domain
        run: |
          cp dist/index.html dist/404.html
          cp public/CNAME dist/CNAME
          touch dist/.nojekyll

      - name: Smoke check build artifact
        run: |
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/CNAME
          grep -q "forms.trentim.com" dist/CNAME
          find dist/assets -type f -name '*.js' | grep -q .
          find dist/assets -type f -name '*.css' | grep -q .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
